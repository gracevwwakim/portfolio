<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">Grace Wakim</a>
            <ul class="nav-menu">
                <li><a href="#about">About</a></li>
                <li><a href="#design">Design</a></li>
                <li><a href="#illustrations">Illustrations</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>xx<span class="highlight">xx</span></h1>
            <p>...</p>
        </div>
    </header>

    <!-- About Section -->
    <section id="about" class="section">
        <div class="container">
            <h2>About Me</h2>
            <div class="about-grid">
                <div class="about-text">
                    <p>xxx</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Design Section -->
    <section id="design" class="section bg-light">
        <div class="container">
            <h2>Design Projects</h2>
            <div class="projects-grid">
                <!-- Project 1 -->
                <div class="project-card">
                    <div class="project-info">
                        <h3>Allegory of a Cave</h3>
                        <p>Book and zine project.</p>
                    </div>
                </div>
                <!-- Project 2 -->
                <div class="project-card">
                    <div class="project-info">
                        <h3>Cereal Boxes</h3>
                        <p>Iconic cereals redesigned with Swiss design principles.</p>
                    </div>
                </div>
                <!-- Project 3 -->
                <div class="project-card">
                    <div class="project-info">
                        <h3>Task Management App</h3>
                        <p>.</p>
                        <a href="#" class="project-link">View Project &rarr;</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section">
        <div class="container text-center">
            <h2>Get In Touch</h2>
            <p>...</p>
            <form id="contact-form" class="contact-form">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy;2026 Grace Wakim</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
